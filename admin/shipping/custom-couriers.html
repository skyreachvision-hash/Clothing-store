<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Custom Couriers | Clothing Store Admin</title><link rel="stylesheet" href="../../assets/css/styles.css"><script type="module" src="../../assets/js/firebase-auth.js"></script><script src="../../assets/js/site.js" defer></script></head><body class="admin-page"><header class="admin-header"><div class="container header-inner"><a class="brand" href="../../index.html">Clothing Store <span class="admin-label">Admin</span></a><div class="admin-account"><span data-admin-account>Admin account</span><button class="button button-small button-outline" data-admin-logout>Log out</button></div></div></header><main class="admin-main"><div class="container"><div class="settings-heading"><div><p class="eyebrow">Shipping configuration</p><h1>Custom Couriers</h1><p class="muted">Configure your own courier services and customer pricing without an API. The existing packing engine determines parcel weight.</p></div><a class="button button-outline" href="./index.html">Back to Shipping</a></div><section class="settings-panel"><form class="settings-form" data-form><input type="hidden" name="id"><div class="settings-fields settings-fields-two"><label class="field"><span>Courier name</span><input name="name" required maxlength="120" placeholder="My Courier"></label><label class="field"><span>Calculation</span><select name="calculation_mode"><option value="fixed">Fixed price</option><option value="weight" selected>Weight based</option><option value="area">Area based</option><option value="weight_area">Weight + area</option></select></label><label class="field field-wide"><span>Description</span><input name="description" maxlength="300"></label><label class="field"><span><input name="is_enabled" type="checkbox" checked> Enabled</span></label></div><h2>Pricing rules</h2><p class="muted">Create one or more customer-facing rates.</p><div data-rates></div><div class="settings-actions"><button class="button button-outline" type="button" data-add>Add pricing rule</button><span class="settings-load-status" data-status>Ready.</span><button class="button button-primary">Save custom courier</button></div></form><div class="admin-sections" data-list></div></section></div></main><script>
async function getToken(){for(let i=0;i<50;i++){if(typeof window.getAdminIdToken==='function'){try{const t=await window.getAdminIdToken();if(t)return t;}catch(e){}}await new Promise(r=>setTimeout(r,200));}throw Error('Authentication required.');}async function api(u,o={}){const h=new Headers(o.headers||{});h.set('Authorization','Bearer '+await getToken());if(o.body)h.set('Content-Type','application/json');const r=await fetch(u,{...o,headers:h}),p=await r.json().catch(()=>({}));if(!r.ok||!p.success)throw Error(p.error||'Request failed.');return p;}const form=document.querySelector('[data-form]'),rates=document.querySelector('[data-rates]'),list=document.querySelector('[data-list]'),status=document.querySelector('[data-status]');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function row(r={}){return '<div class="admin-panel" data-row><div class="settings-fields settings-fields-two"><label class="field"><span>Service name</span><input name="service_name" required value="'+esc(r.service_name||'')+'"></label><label class="field"><span>Area</span><input name="area_name" value="'+esc(r.area_name||'')+'" placeholder="All areas"></label><label class="field"><span>Minimum weight kg</span><input name="min_weight_kg" type="number" min="0" step=".001" value="'+(r.min_weight_kg??'')+'"></label><label class="field"><span>Maximum weight kg</span><input name="max_weight_kg" type="number" min="0" step=".001" value="'+(r.max_weight_kg??'')+'"></label><label class="field"><span>Customer price ZAR</span><input name="price" type="number" min="0" step=".01" required value="'+(r.price??0)+'"></label><label class="field"><span>Estimated delivery</span><input name="estimated_delivery" value="'+esc(r.estimated_delivery||'')+'" placeholder="2–3 business days"></label><label class="field"><span><input name="is_enabled" type="checkbox" '+(r.is_enabled===undefined||Number(r.is_enabled)?'checked':'')+'> Enabled</span></label></div><div class="settings-actions"><button class="button button-outline" type="button" data-remove>Remove</button></div></div>';}let methods=[];const courierEnabled=()=>form.querySelector('input[name="is_enabled"]');const rowField=(r,name)=>r.querySelector('[name="'+name+'"]');function reset(){form.reset();courierEnabled().checked=true;form.elements.calculation_mode.value='weight';form.elements.id.value='';rates.innerHTML=row();}function render(){methods=methods.filter(m=>m.provider_type==='custom'&&m.custom_courier);list.innerHTML=methods.map(m=>{const c=m.custom_courier;return '<section class="admin-panel"><div><h2>'+esc(m.name)+'</h2><p class="muted">'+esc(c.description||'')+' · '+esc(c.calculation_mode)+' · '+(Number(m.is_enabled)?'Enabled':'Disabled')+'</p><p class="muted">'+(c.rates||[]).map(r=>esc(r.service_name)+' · ZAR '+Number(r.price).toFixed(2)).join('<br>')+'</p></div><div class="settings-actions"><button class="button button-outline" data-edit="'+m.id+'">Edit</button><button class="button button-outline" data-delete="'+m.id+'">Delete</button></div></section>';}).join('')||'<p class="muted">No custom couriers configured yet.</p>';}async function load(){try{const p=await api('/api/shipping?include_disabled=1');methods=p.data||[];render();}catch(e){status.textContent=e.message;}}document.querySelector('[data-add]').onclick=()=>rates.insertAdjacentHTML('beforeend',row());rates.addEventListener('click',e=>{if(e.target.closest('[data-remove]'))e.target.closest('[data-row]').remove();});list.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]')?.dataset.edit,del=e.target.closest('[data-delete]')?.dataset.delete;if(edit){const m=methods.find(x=>String(x.id)===String(edit));if(!m)return;const c=m.custom_courier;form.elements.id.value=m.id;form.elements.name.value=m.name;form.elements.description.value=c.description||'';form.elements.calculation_mode.value=c.calculation_mode;form.elements.is_enabled.checked=Number(m.is_enabled)===1;rates.innerHTML=(c.rates||[]).map(row).join('')||row();return;}if(del&&!confirm('Delete this custom courier and all pricing rules?'))return;if(del)try{await api('/api/shipping?resource=custom-courier&id='+del,{method:'DELETE'});reset();load();}catch(x){status.textContent=x.message;}});form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Saving…';const rs=[...rates.querySelectorAll('[data-row]')].map((r,i)=>({service_name:rowField(r,'service_name').value.trim(),area_name:rowField(r,'area_name').value.trim(),min_weight_kg:rowField(r,'min_weight_kg').value===''?null:Number(rowField(r,'min_weight_kg').value),max_weight_kg:rowField(r,'max_weight_kg').value===''?null:Number(rowField(r,'max_weight_kg').value),price:Number(rowField(r,'price').value||0),estimated_delivery:rowField(r,'estimated_delivery').value.trim(),is_enabled:rowField(r,'is_enabled').checked,sort_order:i}));try{const body={resource:'custom-courier',name:form.elements.name.value.trim(),description:form.elements.description.value.trim(),calculation_mode:form.elements.calculation_mode.value,is_enabled:courierEnabled().checked,rates:rs};const id=form.elements.id.value;await api(id?'/api/shipping?resource=custom-courier&id='+id:'/api/shipping',{method:id?'PUT':'POST',body:JSON.stringify(body)});status.textContent='Custom courier saved.';reset();load();}catch(x){status.textContent=x.message;}});reset();load();
</script></body></html>
