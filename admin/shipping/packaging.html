<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Packaging | Clothing Store Admin</title><link rel="stylesheet" href="../../assets/css/styles.css"><script type="module" src="../../assets/js/firebase-auth.js"></script><script src="../../assets/js/site.js" defer></script></head><body class="admin-page"><header class="admin-header"><div class="container header-inner"><a class="brand" href="../../index.html">Clothing Store <span class="admin-label">Admin</span></a><div class="admin-account"><span data-admin-account>Admin account</span><button class="button button-small button-outline" data-admin-logout>Log out</button></div></div></header><main class="admin-main"><div class="container"><div class="settings-heading"><div><p class="eyebrow">Shipping configuration</p><h1>Packaging</h1><p class="muted">Define the bags, boxes, envelopes and other packaging used by the packing engine.</p></div><a class="button button-outline" href="./index.html">Back to Shipping</a></div><section class="settings-panel"><form class="settings-form" data-form><div class="settings-fields settings-fields-two"><label class="field"><span>Packaging name</span><input name="name" required maxlength="120"></label><label class="field"><span>Packaging type</span><select name="packaging_type"><option value="bag">Bag</option><option value="box">Box</option><option value="envelope">Envelope</option><option value="manufacturer">Manufacturer packaging</option><option value="custom">Custom</option></select></label><label class="field"><span>Length (cm)</span><input name="length_cm" type="number" min="0" step=".1"></label><label class="field"><span>Width (cm)</span><input name="width_cm" type="number" min="0" step=".1"></label><label class="field"><span>Height (cm)</span><input name="height_cm" type="number" min="0" step=".1"></label><label class="field"><span>Packaging weight (kg)</span><input name="packaging_weight_kg" type="number" min="0" step=".001" value="0"></label><label class="field"><span>Maximum packed weight (kg)</span><input name="max_weight_kg" type="number" min="0" step=".001"></label><label class="field"><span>Available stock</span><input name="stock_quantity" type="number" min="0" step="1" value="0"></label></div><div class="settings-actions"><span class="settings-load-status" data-status>Ready.</span><button class="button button-primary">Add packaging</button></div></form><div class="admin-sections" data-list></div></section></div></main><script>
async function getToken(){for(let i=0;i<50;i++){if(typeof window.getAdminIdToken==='function'){try{const t=await window.getAdminIdToken();if(t)return t;}catch(e){}}await new Promise(r=>setTimeout(r,200));}throw Error('Authentication required.');}async function api(u,o={}){const h=new Headers(o.headers||{});h.set('Authorization','Bearer '+await getToken());if(o.body)h.set('Content-Type','application/json');const r=await fetch(u,{...o,headers:h}),p=await r.json().catch(()=>({}));if(!r.ok||!p.success)throw Error(p.error||'Request failed.');return p;}const list=document.querySelector('[data-list]'),form=document.querySelector('[data-form]'),status=document.querySelector('[data-status]'),num=x=>x.value===''?null:Number(x.value),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){try{const p=await api('/api/shipping?include_disabled=1'),a=p.packaging||[];list.innerHTML=a.map(x=>'<section class="admin-panel"><div><h2>'+esc(x.name)+'</h2><p class="muted">'+esc(x.packaging_type)+' · '+(x.length_cm!==null?x.length_cm+' × '+x.width_cm+' × '+x.height_cm+' cm':'Dimensions not set')+' · Max '+(x.max_weight_kg===null?'not set':x.max_weight_kg+' kg')+' · Stock '+Number(x.stock_quantity||0)+' · '+(Number(x.is_enabled)?'Enabled':'Disabled')+'</p></div><button class="button button-outline" data-id="'+x.id+'">Delete</button></section>').join('')||'<p class="muted">No packaging configured yet.</p>';}catch(e){status.textContent=e.message;}}list.addEventListener('click',async e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(!id||!confirm('Delete this packaging definition?'))return;try{await api('/api/shipping?resource=packaging&id='+id,{method:'DELETE'});load();}catch(x){status.textContent=x.message;}});form.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/shipping',{method:'POST',body:JSON.stringify({resource:'packaging',name:form.elements.name.value.trim(),packaging_type:form.elements.packaging_type.value,length_cm:num(form.elements.length_cm),width_cm:num(form.elements.width_cm),height_cm:num(form.elements.height_cm),packaging_weight_kg:Number(form.elements.packaging_weight_kg.value||0),max_weight_kg:num(form.elements.max_weight_kg),stock_quantity:Math.max(0,Math.floor(Number(form.elements.stock_quantity.value||0))),is_enabled:true})});form.reset();form.elements.packaging_weight_kg.value='0';status.textContent='Packaging added.';load();}catch(x){status.textContent=x.message;}});load();
</script></body></html>
