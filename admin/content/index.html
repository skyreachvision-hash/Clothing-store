<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Information Pages | Clothing Store Admin</title>
<link rel="stylesheet" href="../../assets/css/styles.css">
<script type="module" src="../../assets/js/firebase-auth.js"></script>
<script src="../../assets/js/site.js" defer></script>
</head>
<body class="admin-page">
<header class="admin-header"><div class="container header-inner"><a class="brand" href="../../index.html">Clothing Store <span class="admin-label">Admin</span></a><div class="admin-account"><span data-admin-account>Admin account</span><button class="button button-small button-outline" type="button" data-admin-logout>Log out</button></div></div></header>
<main class="admin-main"><div class="container">
<div class="settings-heading">
  <div><p class="eyebrow">Store content</p><h1 data-page-title>Information Pages</h1><p class="muted">Update your customer-facing policies and information without changing the website code.</p></div>
  <div><button class="button button-outline" type="button" data-new>New information page</button> <a class="button button-outline" href="../">Back to dashboard</a></div>
</div>
<section class="settings-panel">
<form class="settings-form" data-page-form>
<input type="hidden" name="id">
<div class="settings-fields settings-fields-two">
<label class="field"><span>Page title</span><input name="title" required maxlength="160"></label>
<label class="field"><span>Page slug</span><input name="slug" maxlength="120" placeholder="shipping-policy"></label>
<label class="field"><span>Sort order</span><input name="sort_order" type="number" min="0" step="1" value="0"></label>
<label class="field"><span><input name="is_published" type="checkbox"> Published</span></label>
<label class="field" style="grid-column:1/-1"><span>Page content</span><textarea name="content" rows="18" placeholder="Write the information customers should see…" style="width:100%;resize:vertical"></textarea></label>
</div>
<div class="settings-actions">
<span class="settings-load-status" data-status>Ready.</span>
<div><button class="button button-outline" type="button" data-delete hidden>Delete page</button> <button class="button button-primary" type="submit" data-save>Save page</button></div>
</div>
</form>
</section>
<section class="admin-sections" data-page-list></section>
</div></main>
<footer class="site-footer"><div class="container footer-inner"><a class="brand" href="../../index.html">Clothing Store</a><p>© <span data-current-year>2026</span> Clothing Store</p><a href="../../index.html">View storefront</a></div></footer>
<script src="../../assets/js/content-admin.js" defer></script>
</body>
</html>
